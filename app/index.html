<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>CleanYourTV</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="ambient"></div>

  <main id="shell">
    <header>
      <div>
        <div id="greeting">CleanYourTV</div>
        <div id="focusedName">Đang tải ứng dụng…</div>
      </div>
      <div id="clockWrap">
        <div id="clock">--:--</div>
        <div id="date">---</div>
      </div>
    </header>

    <section id="dockSection">
      <div id="dock" class="dock"></div>
    </section>

    <section id="appsSection">
      <div class="sectionTitle">
        <span>Ứng dụng</span>
        <span id="count"></span>
      </div>
      <div id="grid" class="grid"></div>
    </section>

    <footer>
      <span>← ↑ ↓ → Di chuyển</span>
      <span>OK Mở</span>
      <span>BACK Quay lại TizenBrew</span>
      <span>VÀNG Làm mới</span>
    </footer>

    <div id="toast"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
